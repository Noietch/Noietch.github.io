- title: Selected Projects
  type: nested_list
  contents:
    - title: EPoG — Long-horizon task planner on 3D scene graphs
      items:
        - Graph-edit planner with LLM-guided heuristic that fuses task- and motion-level reasoning; 91.3% success rate on 5 long-horizon transport tasks across 46 ProcThor-10k scenes.
        - Validated on a physical mobile manipulator handling unknown object states and runtime exceptions in real, dynamic environments.
    - title: CR-Solver — GPU-accelerated kinematics for continuum robots
      items:
        - Unified nonlinear-optimization framework for IK, path following, and trajectory planning; pure Python/JAX with GPU parallelism.
        - "> 95% success rate with millimeter-level accuracy."
    - title: EVA-Client — Unified framework for deployment, evaluation, and data collection on real robots
      items:
        - One policy, any robot — a smooth all-in-one real-robot stack. Debug, record, evaluate, and visualize entirely in the browser.
        - Drives an AgileX bimanual arm end-to-end (teleop → record → π₀ checkpoint → smooth async deploy) on real hardware.
    - title: BRBOTS — 18-DoF humanoid biped robot
      items:
        - Team leader across two hardware iterations; hardware, electronics, firmware, ROS stack, gait planner, particle-filter visual localization.
        - 2nd Prize (top-4), RoboCup Asia-Pacific Championship.

